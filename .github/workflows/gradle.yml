name: Build and Release

on:
  push:
    branches:
      - main # Triggers on every single push to the main branch
  pull_request:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Client and Server JARs
        run: ./gradlew buildClient buildServer

      - name: Read Version from file
        # If running on a PR, we don't need a release, so skip this
        if: github.event_name == 'push'
        id: read_version
        run: |
          # Find the version file location
          if [ -f "resources/version.txt" ]; then
            FILE_PATH="resources/version.txt"
          else
            FILE_PATH="src/main/resources/version.txt"
          fi
          
          # Read the first line, limit to 20 characters, and trim spaces
          VERSION_TEXT=$(head -n 1 $FILE_PATH | cut -c 1-20 | xargs)
          echo "app_version=$VERSION_TEXT" >> $GITHUB_ENV

      - name: Create Release and Upload JARs
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.app_version }}" # Automatically creates a tag like v0.1.0-alpha
          name: "Finecraft ${{ env.app_version }}"
          files: |
            build/dist/*.jar
          generate_release_notes: true